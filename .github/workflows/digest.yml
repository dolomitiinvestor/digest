name: HN Digest

on:
  schedule:
    # Builds the digest the evening before; Resend delivers it at exactly
    # 7:00am America/New_York (DST handled in hn_digest.py).
    # 23:17 UTC Sun-Thu = 6-7pm ET the night before a weekday. GitHub can start
    # runs hours late, so this leaves ~12h of slack before 7am.
    # For every day, use "17 23 * * *".
    - cron: "17 23 * * 0-4"
  workflow_dispatch:          # adds a "Run workflow" button for manual testing

# Prevents overlapping runs if one hangs
concurrency:
  group: hn-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python hn_digest.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
