name: HN Digest

on:
  schedule:
    # 12:00 UTC = 8am EDT / 7am EST. Cron is ALWAYS UTC — it does not shift for DST.
    # GitHub queues these, so expect 5-20 min of drift. Fine for a daily email.
    - cron: "0 12 * * 1-5"   # weekdays only; use "0 12 * * *" for every day
  workflow_dispatch:          # adds a "Run workflow" button for manual testing

# Prevents overlapping runs if one hangs
concurrency:
  group: hn-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python hn_digest.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
